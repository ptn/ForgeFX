name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fired by forgefx-midi releases (codec-released repository_dispatch) so the server is
  # re-validated against each new codec release. CI always checks out the codec's
  # default-branch HEAD, which by then contains the tagged release commit.
  repository_dispatch:
    types: [codec-released]

# One CI run per ref; a newer push/dispatch cancels the in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The server consumes forgefx-midi as a sibling workspace link (server/package.json:
# "forgefx-midi": "file:../../forgefx-midi"), so every job checks out BOTH repos side by
# side under the workspace and builds the codec package first (its exports point at dist/).
jobs:
  server:
    name: server (codec tests + typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ForgeFX
      - uses: actions/checkout@v4
        with:
          repository: sKuhLight/forgefx-midi
          path: forgefx-midi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ForgeFX/server/package-lock.json
            forgefx-midi/package-lock.json
      - name: Build + test forgefx-midi (golden SysEx suites)
        working-directory: forgefx-midi
        # build BEFORE test: the devices-smoke suite loads the descriptors from dist/
        run: |
          npm ci
          npm run build
          npm test
      - name: Server install + typecheck + tests + build
        working-directory: ForgeFX/server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ForgeFX
      - uses: actions/checkout@v4
        with:
          repository: sKuhLight/forgefx-midi
          path: forgefx-midi
      # The Dockerfile expects a forgefx-midi/ copy inside the build context (it builds the
      # codec in-image and mounts it at /forgefx-midi, where the server's file: link resolves).
      - name: Stage forgefx-midi into the build context
        run: rsync -a --exclude node_modules --exclude .git forgefx-midi/ ForgeFX/forgefx-midi/
      - name: Build runtime image
        run: docker build -t forgefx:ci ForgeFX

  # On a green push to main, tell Axis CI that the stack moved. The Axis web app
  # (axisapp.live) bundles forgefx-server into its Browser Direct runtime, so a server
  # change must redeploy the site even without an Axis commit. Soft-gated: no token →
  # print a notice and succeed (never a red X on forks / unconfigured repos).
  notify-axis:
    name: notify Axis (stack-updated)
    runs-on: ubuntu-latest
    needs: [server, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Dispatch stack-updated to Axis
        env:
          TOKEN: ${{ secrets.STACK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "STACK_DISPATCH_TOKEN not configured — skipping Axis notify."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sKuhLight/Axis/dispatches \
            -d "{\"event_type\":\"stack-updated\",\"client_payload\":{\"repo\":\"ForgeFX\",\"sha\":\"${{ github.sha }}\"}}"

  # Enforce a version bump on every non-docs PR (release tags are cut off server/package.json;
  # a stale version silently ships the same release twice). PR-only — this workflow also runs on
  # push + the codec-released dispatch, neither of which has a base branch to diff. Docs-only PRs
  # (nothing but *.md changed) are waved through. Compare rule: numeric major.minor.patch, and on
  # an equal triple a prerelease (-beta) ranks BELOW its release; head must be > base.
  version-guard:
    name: version bump guard (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a version bump (unless docs-only)
        env:
          PKG: server/package.json
        shell: bash
        run: |
          set -euo pipefail
          # fetch-depth 0 isn't needed — fetch just the base ref, one commit deep. HEAD is the
          # PR MERGE commit, so a plain two-commit tree diff vs the base tip IS the PR delta
          # (a three-dot diff would need a merge base, which shallow fetches don't have).
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          CHANGED="$(git diff --name-only "origin/$GITHUB_BASE_REF" HEAD)"
          echo "Changed files:"; echo "$CHANGED"
          # Exempt: docs (*.md) and stack.lock.json — pin-bump auto-PRs (codec-bump.yml)
          # intentionally move only the pin; the version bumps with the RELEASE that ships it.
          NON_EXEMPT="$(echo "$CHANGED" | grep -vE '(\.md|^stack\.lock\.json)$' || true)"
          if [ -z "$NON_EXEMPT" ]; then
            echo "docs/pin-only PR — version bump not required." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          HEAD_VER="$(node -p "require('./$PKG').version")"
          BASE_VER="$(git show "origin/$GITHUB_BASE_REF:$PKG" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          echo "Base $PKG version: $BASE_VER"
          echo "Head $PKG version: $HEAD_VER"
          HEAD_VER="$HEAD_VER" BASE_VER="$BASE_VER" PKG="$PKG" node -e '
            const parse = v => {
              const [core, pre = ""] = String(v).split("-");
              return { nums: core.split(".").map(Number), pre };
            };
            const cmp = (a, b) => {
              const pa = parse(a), pb = parse(b);
              for (let i = 0; i < 3; i++) {
                const d = (pa.nums[i] || 0) - (pb.nums[i] || 0);
                if (d) return d < 0 ? -1 : 1;
              }
              if (pa.pre === pb.pre) return 0;
              if (pa.pre === "") return 1;   // a release outranks a prerelease of the same triple
              if (pb.pre === "") return -1;
              return pa.pre < pb.pre ? -1 : (pa.pre > pb.pre ? 1 : 0);
            };
            const head = process.env.HEAD_VER, base = process.env.BASE_VER, pkg = process.env.PKG;
            if (cmp(head, base) > 0) {
              console.log(`OK: ${head} > ${base}`);
            } else {
              console.error(`Version not bumped: head ${head} is not greater than base ${base}.`);
              console.error(`Fix: in server/, run \`npm version X.Y.Z --no-git-tag-version\` (this also bumps the lockfile) and commit.`);
              process.exit(1);
            }
          '
