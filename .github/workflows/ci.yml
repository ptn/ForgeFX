name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build & test (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build + run the test suite inside the Dockerfile's `test` stage.
      # This keeps CI and deployment on the exact same toolchain and avoids a
      # separate .NET setup action.
      - name: Build & test
        run: docker build --target test -t forgefx:test .

      # Ensure the deployable runtime image builds too (reuses cached layers).
      - name: Build runtime image
        run: docker build --target runtime -t forgefx:latest .
