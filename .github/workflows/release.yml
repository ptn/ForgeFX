name: release

# Tag a version (e.g. v0.1.0-beta) to build the multi-arch Docker image, push it to GHCR,
# and open a DRAFT GitHub release for you to review and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: docker image -> GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    name: draft github release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ForgeFX ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ForgeFX ${{ github.ref_name }} — community beta.

            **Docker (recommended):**
            ```sh
            docker run --rm -p 5056:5056 --device /dev/ttyACM0 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Independent, third-party software. Not affiliated with Fractal Audio Systems. Use at your own risk — see DISCLAIMER.md.
